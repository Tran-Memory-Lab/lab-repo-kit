# Reusable workflow. Reports drift between .lab-repo-kit/ and the pinned kit; never rewrites.
#   uses: Tran-Memory-Lab/lab-repo-kit/.github/workflows/kit-drift.yml@v0.1.0
#   with: { kit-ref: v0.1.0 }
name: kit-drift
on:
  workflow_call:
    inputs:
      kit-ref:
        description: lab-repo-kit tag; must equal the tag in the uses line
        required: true
        type: string
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tran-Memory-Lab/lab-repo-kit
          ref: ${{ inputs.kit-ref }}
          path: _lab-repo-kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./_lab-repo-kit
      - run: lab-check-vendored --repo . --kit _lab-repo-kit
